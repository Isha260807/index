<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Modula</title>
    <link rel="stylesheet" href="ProjectShareModula.css">
</head>
<body>
    <!--wrapper calss-->
    <div class="wrapper">
        <!--for circle-->
        <div class="circle1"></div>
          <!--circle2-->
        <div class="circle2"></div>
        <!--content-->
        <div class="content">
          <!--Image-->
            <div class="image">
                <img src="nisha photo.jpg" alt="User">
            </div>
            <!--Name, design-->
            <div class="user-name">
                <h2>Nisha Kumari</h2>
            </div>
            <div class="design"> 
                <h3>Founder, Code Help</h3>
            </div>
            <!--button both-->
            <div class="btn-grp">
                <button class="btn1">
                    <i class="fa-solid fa-share"></i>
                    <div>Share my profile</div>
                </button>
    
                <button class="btn2">Follow Me</button>
            </div>    
        </div>
    </div>


    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

</body>
</html>
